# Set prefix to Ctrl-Space.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# True color support.
# Report TERM as xterm-256color (not tmux-256color) so apps don't apply the
# legacy "screen/tmux means no truecolor" heuristic and quantize to 256 colors.
# RGB feature keeps real 24-bit color passing through to Alacritty.
set -g default-terminal "xterm-256color"
set -as terminal-features ",xterm-256color:RGB"

# Focus events for apps like Claude Code.
set -g focus-events on

# Vim-like key bindings for pane navigation (default uses cursor keys).
unbind h
bind h select-pane -L
unbind j
bind j select-pane -D
unbind k
bind k select-pane -U
unbind l # normally used for last-window
bind l select-pane -R

# Open new/split panes with the path of the current pane.
unbind c
bind c new-window -c '#{pane_current_path}'

# Intuitive window-splitting keys.
bind | split-window -h -c '#{pane_current_path}' # normally prefix-%
bind \\ split-window -h -c '#{pane_current_path}' # normally prefix-%
bind - split-window -v -c '#{pane_current_path}' # normally prefix-"

# Toggle sending input to all panes at once (capital S).
bind S setw synchronize-panes \; display "sync #{?synchronize-panes,on,off}"

# Enable vi for copy mode
setw -g mode-keys vi
set-window-option -g mode-keys vi

# Vim-style selection in copy mode:
#   v    char-wise selection
#   V    line-wise selection (Shift+v)
#   C-v  block / rectangle selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# y yanks the current selection straight to the macOS system clipboard.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel pbcopy

# Mouse: drag-select and release copies to the system clipboard too.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel pbcopy

# mpd control (disabled for now -- < and > now reorder windows; see below)
# unbind p
# bind p run-shell "mpc -q toggle"
# bind > run-shell "mpc -q next"
# bind < run-shell "mpc -q prev"

# Reorder windows: move the current window left/right. -r makes them
# repeatable (hold prefix once, tap </> several times); select-window
# keeps focus on the window you just moved.
bind -r < swap-window -t -1 \; select-window -t -1
bind -r > swap-window -t +1 \; select-window -t +1

# Start window and pane numbering at 1, (0 is too hard to reach).
set -g base-index 1
set -g pane-base-index 1

# Don't wait for an escape sequence after seeing C-Space.
set -s escape-time 0

# set history limit to go back
set -g history-limit 4096

# set style of tmux
set -g status-style 'bg=#232323,fg=#555555'
set -g status-left-length 40
set -g status-left "#[fg=#c0c5ce]#S  "
set -g status-right "#[fg=#555555]#h  %R "
set -g status-interval 60

# Window list
set -g window-status-style 'fg=#555555'
set -g window-status-current-style 'fg=#c0c5ce'
set -g window-status-format '#I:#W'
set -g window-status-current-format '#I:#W'

# Mouse on: scroll wheel enters copy-mode scrollback instead of being
# converted to arrow keys (which leak into full-screen apps like Claude Code).
# To select/copy with the native terminal instead of tmux, hold Shift while
# dragging (works in iTerm2 and Alacritty).
set -g mouse on

# Dynamically update iTerm tab and window titles.
set -g set-titles on

# #T      = standard window title (last command, see ~/.bash_profile)
# #h      = short hostname
# #S      = session name
# #W      = tmux window name
#
# (Would love to include #(pwd) here as well, but that would only print the
# current working directory relative to the session -- ie. always the starting
# cwd -- which is not very interesting).
set -g set-titles-string "#T : #h > #S > #W"

# Show bells in window titles.
set -g window-status-bell-style fg=yellow,bold,underscore

# Turn off distracting border highlight: the background highlighting is probably
# enough. Default value of 8 comes from "pane-border-fg" in tmux's
# options-table.c.
set -ga pane-active-border-style bg=default,fg=default

# But don't change tmux's own window titles.
set -w -g automatic-rename off

# Automatically renumber window numbers on closing a pane (tmux >= 1.7).
set -g renumber-windows on

# List of plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-restore the last saved session when the tmux server starts (e.g. after a
# reboot), so `tm` attaches to a restored 'main' instead of a fresh empty one.
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

[general]
import = [
    "~/.config/alacritty/themes/gruvbox_material_hard_dark.toml"
]

[window]
startup_mode = "Maximized"
padding.x = 12
padding.y = 12

[window.dimensions]
columns = 100
lines = 30

[font]
# Define the normal font style
size = 13.5

normal.family = "FiraCode Nerd Font"
bold.family = "FiraCode Nerd Font"
italic.family = "FiraCode Nerd Font"
bold_italic.family = "FiraCode Nerd Font"

[scrolling]
history = 10000

[colors.primary]
background = "#232323"
foreground = "#C0C5CE"

[[keyboard.bindings]]
key = "Right"
mods = "Alt"
chars = "\u001bf"

[[keyboard.bindings]]
key = "Left"
mods = "Alt"
chars = "\u001bb"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u000a"
